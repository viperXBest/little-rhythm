<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
<!-- Little Rhythm notification icon (original). Pure white (#FFFFFF) on transparent, no text, no logo:
     a solid cloud silhouette with no face, no cut-outs and no thin details, so it stays a cloud at 24 dp
     in the status bar. Android tints it with the expo-notifications colour (primary). -->
  <g fill="#FFFFFF">
    <circle cx="30" cy="56" r="20"/>
    <circle cx="48" cy="40" r="24"/>
    <circle cx="68" cy="54" r="20"/>
    <rect x="30" y="56" width="38" height="20"/>
    <circle cx="32" cy="64" r="12"/>
    <circle cx="66" cy="64" r="12"/>
  </g>
</svg>
